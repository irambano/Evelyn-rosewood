<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Runner - Laptop Optimized</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{background:#0d1117;color:#58a6ff;font-family:"Courier New",monospace;display:flex;justify-content:center;align-items:center}
#game-container{width:min(96vw,900px);text-align:center}
h1{color:#00ff66;text-shadow:0 0 10px rgba(0,255,102,.5);margin:4px 0 8px;font-size:clamp(1.3rem,3vw,1.8rem)}
.stats{display:flex;justify-content:space-around;align-items:center;background:#161b22;padding:8px;border-radius:6px;border:1px solid #30363d;margin-bottom:8px;font-weight:bold;font-size:clamp(.75rem,2vw,1rem)}
canvas{display:block;width:100%;height:auto;max-height:70vh;aspect-ratio:800/500;background:#000;border:2px solid #00ff66;border-radius:4px;box-shadow:0 0 20px rgba(0,255,102,.2);touch-action:none}
.instructions{margin-top:7px;color:#8b949e;font-size:clamp(.65rem,1.8vw,.9rem)}
.btn{background:#238636;color:#fff;border:none;padding:9px 18px;font-size:1rem;border-radius:6px;cursor:pointer;margin-top:10px;font-weight:bold}
.btn:hover{background:#2ea043}
@media (max-height:650px){h1{margin:2px 0 4px;font-size:1.3rem}.stats{padding:5px;margin-bottom:5px}canvas{max-height:62vh}.instructions{margin-top:4px}.btn{margin-top:5px;padding:7px 15px}}
</style>
</head>
<body>
<div id="game-container">
<h1>CYBER RUNNER</h1>
<div class="stats">
<div>❤️ HP: <span id="hp">100</span></div>
<div>💾 CHIPS: <span id="chips">0</span>/5</div>
<div>⭐ SCORE: <span id="score">0</span></div>
</div>
<canvas id="gameCanvas" width="800" height="500"></canvas>
<div class="instructions">💻 WASD / Arrow Keys — Collect 5 chips → Hack terminal → Escape portal</div>
<button class="btn" id="actionBtn" onclick="startGame()">▶ PLAY</button>
</div>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const hpEl=document.getElementById("hp");
const chipsEl=document.getElementById("chips");
const scoreEl=document.getElementById("score");
const actionBtn=document.getElementById("actionBtn");

let gameActive=false,player,bots,chips,portal,terminal,lastTime=0;
const keys={};

class Player{
 constructor(){this.x=50;this.y=250;this.radius=12;this.speed=5.2;this.hp=100;this.chipsCollected=0;this.terminalHacked=false}
 draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fillStyle="#00ff66";ctx.shadowBlur=12;ctx.shadowColor="#00ff66";ctx.fill();ctx.shadowBlur=0}
 update(dt){
  let dx=0,dy=0;
  if(keys.w||keys.arrowup)dy--;
  if(keys.s||keys.arrowdown)dy++;
  if(keys.a||keys.arrowleft)dx--;
  if(keys.d||keys.arrowright)dx++;
  if(dx||dy){const len=Math.hypot(dx,dy);this.x+=dx/len*this.speed*60*dt;this.y+=dy/len*this.speed*60*dt}
  this.x=Math.max(this.radius,Math.min(canvas.width-this.radius,this.x));
  this.y=Math.max(this.radius,Math.min(canvas.height-this.radius,this.y));
 }
}

class Bot{
 constructor(x,y,speed){this.x=x;this.y=y;this.radius=10;this.speed=speed}
 draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fillStyle="#ff3333";ctx.shadowBlur=14;ctx.shadowColor="#ff3333";ctx.fill();ctx.shadowBlur=0}
 update(tx,ty,dt){
  const dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy);
  if(d>0){this.x+=dx/d*this.speed*60*dt;this.y+=dy/d*this.speed*60*dt}
 }
}

class Item{
 constructor(x,y,type){this.x=x;this.y=y;this.size=15;this.type=type;this.active=true}
 draw(){
  if(!this.active)return;
  const color=this.type==="chip"?"#00e1ff":this.type==="terminal"?"#ffcc00":"#cc00ff";
  ctx.fillStyle=color;ctx.shadowBlur=10;ctx.shadowColor=color;
  ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size,this.size);ctx.shadowBlur=0;
 }
}

window.addEventListener("keydown",e=>{
 const key=e.key.toLowerCase();keys[key]=true;
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key))e.preventDefault();
},{passive:false});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
window.addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));

function checkCollision(a,b){
 const dx=a.x-b.x,dy=a.y-b.y;
 const ra=a.radius!==undefined?a.radius:a.size/2;
 const rb=b.radius!==undefined?b.radius:b.size/2;
 return Math.hypot(dx,dy)<ra+rb;
}

function initGame(){
 player=new Player();
 bots=[new Bot(700,80,6.0),new Bot(700,420,6.5),new Bot(450,450,7.0)];
 chips=[];
 for(let i=0;i<5;i++)chips.push(new Item(120+Math.random()*560,50+Math.random()*400,"chip"));
 terminal=new Item(700,250,"terminal");
 portal=new Item(50,80,"portal");
 portal.active=false;
 hpEl.innerText="100";chipsEl.innerText="0";scoreEl.innerText="0";
}

function startGame(){
 if(gameActive)return;
 initGame();
 gameActive=true;
 actionBtn.style.display="none";
 lastTime=performance.now();
 requestAnimationFrame(gameLoop);
}

function gameOver(victory=false){
 gameActive=false;
 actionBtn.style.display="inline-block";
 actionBtn.innerText="🔄 PLAY AGAIN";
 ctx.fillStyle="rgba(0,0,0,.88)";
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.font="bold 30px Courier New";
 ctx.textAlign="center";
 ctx.fillStyle=victory?"#00ff66":"#ff3333";
 ctx.fillText(victory?"MISSION COMPLETE ✔":"SYSTEM OVERRIDE - YOU DIED",canvas.width/2,canvas.height/2);
}

function gameLoop(now){
 if(!gameActive)return;
 const dt=Math.min(0.033,(now-lastTime)/1000);lastTime=now;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 player.update(dt);player.draw();

 chips.forEach(chip=>{
  if(chip.active&&checkCollision(player,chip)){
   chip.active=false;player.chipsCollected++;
   chipsEl.innerText=player.chipsCollected;
   scoreEl.innerText=player.chipsCollected*200;
  }
  chip.draw();
 });

 if(player.chipsCollected===5){
  terminal.draw();
  if(checkCollision(player,terminal)&&!player.terminalHacked){
   player.terminalHacked=true;portal.active=true;terminal.active=false;
  }
 }

 if(portal.active){
  portal.draw();
  if(checkCollision(player,portal)){gameOver(true);return}
 }

 for(const bot of bots){
  bot.update(player.x,player.y,dt);bot.draw();
  if(checkCollision(player,bot)){
   player.hp-=1.8*60*dt;
   hpEl.innerText=Math.max(0,Math.floor(player.hp));
   if(player.hp<=0){gameOver(false);return}
  }
 }

 requestAnimationFrame(gameLoop);
}

ctx.fillStyle="#161b22";ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.font="20px Courier New";ctx.fillStyle="#58a6ff";ctx.textAlign="center";
ctx.fillText("SYSTEM READY. PRESS PLAY TO INITIALIZE.",canvas.width/2,canvas.height/2);
</script>
</body>
</html>
