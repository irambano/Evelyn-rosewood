<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cyber Runner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06101c;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:3;font-weight:bold}
.p{background:#09213acc;border:1px solid #38ddff66;border-radius:20px;padding:8px 11px}
#start,#end{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#050b16eF;text-align:center;padding:20px}
.box{max-width:520px;padding:28px;border:1px solid #39ddff66;border-radius:24px;background:#091827;box-shadow:0 0 60px #00cfff22}
h1{color:#58edff;font-size:clamp(34px,9vw,58px);margin:5px 0}p{line-height:1.5;color:#c9d8e5}
button{border:1px solid #49e5ff77;background:#103654;color:white;border-radius:14px;padding:13px 18px;font-weight:bold;font-size:16px}
#controls{position:fixed;bottom:16px;left:16px;right:16px;z-index:5;display:flex;justify-content:space-between}
.pad{display:grid;grid-template-columns:55px 55px 55px;grid-template-rows:55px 55px;gap:6px}.c{width:55px;height:55px;padding:0;background:#0d2a45dd;font-size:22px}.u{grid-column:2}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}
.hidden{display:none!important}
</style></head><body>
<div id="hud"><div class="p">❤️ <span id="hp">100</span></div><div class="p">💾 <span id="chips">0</span>/5</div><div class="p">⭐ <span id="score">0</span></div></div>
<canvas id="c"></canvas>
<div id="start"><div class="box"><div style="font-size:60px">🧑‍💻⚡</div><h1>CYBER RUNNER</h1><p>Collect 5 encrypted data chips, hack the terminal, then escape through the portal. Security bots are slow, but they are persistent. 🤖</p><p>Use WASD/arrow keys or the touch controls.</p><button onclick="begin()">▶ PLAY</button></div></div>
<div id="end" class="hidden"><div class="box"><div id="ei" style="font-size:60px">🏆</div><h1 id="et">MISSION COMPLETE</h1><p id="ed"></p><button onclick="begin()">🔄 PLAY AGAIN</button></div></div>
<div id="controls"><div class="pad"><button class="c u" data-k="u">▲</button><button class="c l" data-k="l">◀</button><button class="c d" data-k="d">▼</button><button class="c r" data-k="r">▶</button></div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');let W,H,D,run=false,last=0,score=0,hp=100,got=0,hack=false;
const k={u:0,d:0,l:0,r:0};let p,bots,chips,walls,term,exit;
function setKey(key,on){k[key]=on}
function bindControls(){
 document.querySelectorAll('[data-k]').forEach(b=>{
   const key=b.dataset.k;
   const down=e=>{e.preventDefault();e.stopPropagation();setKey(key,1);b.setPointerCapture?.(e.pointerId)};
   const up=e=>{e.preventDefault();e.stopPropagation();setKey(key,0)};
   b.addEventListener('pointerdown',down,{passive:false});
   b.addEventListener('pointerup',up,{passive:false});
   b.addEventListener('pointercancel',up,{passive:false});
   b.addEventListener('lostpointercapture',up,{passive:false});
 });
}
bindControls();
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function begin(){Object.keys(k).forEach(q=>k[q]=0);document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');score=0;hp=100;got=0;hack=false;p={x:70,y:H-90,r:16,s:210};chips=[[W*.22,H*.22],[W*.47,H*.18],[W*.75,H*.27],[W*.29,H*.58],[W*.68,H*.68]].map(q=>({x:q[0],y:q[1],r:10}));bots=[{x:W*.8,y:H*.2,r:17,s:42},{x:W*.52,y:H*.5,r:17,s:36}];walls=[{x:W*.15,y:H*.38,w:W*.25,h:18},{x:W*.57,y:H*.42,w:W*.27,h:18},{x:W*.42,y:H*.67,w:18,h:H*.2}];term={x:W*.86,y:H*.52,r:25};exit={x:55,y:75,r:24};run=true;last=performance.now();requestAnimationFrame(loop)}
function hitRect(o,nx,ny){if(nx<o.r||nx>W-o.r||ny<o.r+42||ny>H-o.r)return true;let q={x:nx,y:ny,r:o.r};return walls.some(r=>{let a=Math.max(r.x,Math.min(q.x,r.x+r.w)),b=Math.max(r.y,Math.min(q.y,r.y+r.h));return Math.hypot(q.x-a,q.y-b)<q.r})}
function move(dt){let dx=k.r-k.l,dy=k.d-k.u;if(!dx&&!dy)return;let z=Math.hypot(dx,dy);dx/=z;dy/=z;let nx=p.x+dx*p.s*dt,ny=p.y+dy*p.s*dt;if(!hitRect(p,nx,p.y))p.x=nx;if(!hitRect(p,p.x,ny))p.y=ny}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt){move(dt);chips=chips.filter(q=>{if(dist(p,q)<p.r+q.r){got++;score+=100;return false}return true});
bots.forEach(b=>{let d=dist(p,b);if(d<300){let a=Math.atan2(p.y-b.y,p.x-b.x),s=b.s*(d<150?1.15:.75),nx=b.x+Math.cos(a)*s*dt,ny=b.y+Math.sin(a)*s*dt;if(!hitRect(b,nx,b.y))b.x=nx;if(!hitRect(b,b.x,ny))b.y=ny}if(d<p.r+b.r)hp-=25*dt});
if(got===5&&dist(p,term)<75&&hack){term.done=true;score+=500}
if(term.done&&dist(p,exit)<50){run=false;finish(true)}if(hp<=0){run=false;finish(false)}
document.getElementById('hp').textContent=Math.max(0,Math.ceil(hp));document.getElementById('chips').textContent=got;document.getElementById('score').textContent=score}
function draw(){x.fillStyle='#06101c';x.fillRect(0,0,W,H);x.strokeStyle='#123047';for(let a=0;a<W;a+=32){x.beginPath();x.moveTo(a,45);x.lineTo(a,H);x.stroke()}for(let a=45;a<H;a+=32){x.beginPath();x.moveTo(0,a);x.lineTo(W,a);x.stroke()}walls.forEach(r=>{x.fillStyle='#102b42';x.fillRect(r.x,r.y,r.w,r.h)});chips.forEach(q=>{x.fillStyle='#55edff';x.shadowBlur=18;x.shadowColor='#00d9ff';x.fillRect(q.x-9,q.y-9,18,18);x.shadowBlur=0});x.fillStyle=term.done?'#24c77a':'#9b4de8';x.beginPath();x.arc(term.x,term.y,term.r,0,7);x.fill();x.font='22px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(term.done?'✓':'🔐',term.x,term.y);x.fillStyle=term.done?'#25d98b':'#344455';x.beginPath();x.arc(exit.x,exit.y,exit.r,0,7);x.fill();x.fillStyle='#fff';x.fillText('🚪',exit.x,exit.y);bots.forEach(b=>{x.fillStyle='#ff3158';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.fillStyle='#fff';x.fillText('⚠',b.x,b.y)});x.fillStyle='#58edff';x.shadowBlur=18;x.shadowColor='#00d9ff';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.shadowBlur=0;x.fillText('🧑‍💻',p.x,p.y)}
function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function finish(win){document.getElementById('end').classList.remove('hidden');document.getElementById('ei').textContent=win?'🏆':'💥';document.getElementById('et').textContent=win?'NETWORK SAVED!':'SYSTEM BREACHED';document.getElementById('ed').textContent=win?'You hacked the terminal and escaped with '+score+' points! 🛡️':'The bots caught you. Final score: '+score+'. Try again!'}
addEventListener('keydown',e=>{let a=e.key.toLowerCase();if(a==='w'||a==='arrowup')k.u=1;if(a==='s'||a==='arrowdown')k.d=1;if(a==='a'||a==='arrowleft')k.l=1;if(a==='d'||a==='arrowright')k.r=1;if(a==='h')hack=true});
addEventListener('blur',()=>Object.keys(k).forEach(q=>k[q]=0));
addEventListener('pointercancel',()=>Object.keys(k).forEach(q=>k[q]=0));
addEventListener('keyup',e=>{let a=e.key.toLowerCase();if(a==='w'||a==='arrowup')k.u=0;if(a==='s'||a==='arrowdown')k.d=0;if(a==='a'||a==='arrowleft')k.l=0;if(a==='d'||a==='arrowright')k.r=0;if(a==='h')hack=false});

</script></body></html>
