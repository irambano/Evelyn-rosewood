<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escape Room: The Last Signal</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#eef3f8;font-family:system-ui,Arial;padding:12px}.game{max-width:820px;margin:auto}h1{margin:4px 0;color:#65e6ff;font-size:clamp(26px,7vw,44px)}.sub{color:#9eabb8}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill,.btn{background:#141a22;border:1px solid #334454;color:#fff;border-radius:10px;padding:9px 12px}.btn{cursor:pointer;font-weight:700}.scene{position:relative;aspect-ratio:16/10;border:2px solid #334454;border-radius:18px;overflow:hidden;background:linear-gradient(#121a24 0 64%,#20252a 64%)}.neon{position:absolute;top:8%;left:8%;right:8%;height:7px;background:#65e6ff;box-shadow:0 0 20px #65e6ff}.desk{position:absolute;left:8%;bottom:16%;width:35%;height:22%;background:#6b4b35;border:3px solid #3a281d}.screen{position:absolute;left:14%;top:15%;width:65%;height:58%;background:#071016;border:5px solid #18232c;color:#65e6ff;padding:15px;font-family:monospace}.cab{position:absolute;right:8%;bottom:16%;width:22%;height:42%;background:#29343d;border:3px solid #52616c}.panel{position:absolute;right:14%;top:20%;width:12%;height:18%;background:#111;border:3px solid #65e6ff;display:grid;place-items:center;font-size:30px}.vent{position:absolute;left:8%;top:28%;font-size:45px}.hot{position:absolute;border:2px dashed transparent;background:#ffffff05;border-radius:8px;cursor:pointer}.hot:hover{border-color:#65e6ff;background:#65e6ff18}.h-screen{left:13%;top:13%;width:27%;height:30%}.h-desk{left:7%;bottom:13%;width:38%;height:28%}.h-cab{right:7%;bottom:13%;width:25%;height:48%}.h-panel{right:12%;top:17%;width:17%;height:25%}.h-vent{left:6%;top:23%;width:17%;height:28%}.inventory{display:flex;gap:8px;overflow:auto;padding:10px 0}.item{min-width:74px;background:#111821;border:1px solid #405263;border-radius:12px;padding:8px;text-align:center;cursor:pointer}.item.sel{border-color:#65e6ff;box-shadow:0 0 12px #65e6ff44}.msg{margin:8px 0;padding:12px;background:#10161e;border:1px solid #334454;border-radius:12px;min-height:48px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:5}.card{width:min(480px,100%);background:#111820;border:1px solid #65e6ff;border-radius:18px;padding:20px}.card h2{color:#65e6ff}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{padding:15px;background:#1a232d;color:white;border:1px solid #405263;border-radius:10px;font-size:18px}.hidden{display:none!important}</style></head><body><main class="game"><h1>🛰️ The Last Signal</h1><p class="sub">You are trapped in a research station. Repair the signal, decode the terminal, and unlock the emergency hatch.</p><div class="bar"><span class="pill">🔋 Power <b id="power">0%</b></span><span class="pill">🧩 Items <b id="count">0</b></span><span class="pill">💡 Hints <b id="hints">3</b></span><button class="btn" id="restart">↻ Restart</button><button class="btn" id="hint">💡 Hint</button></div><section class="scene"><div class="neon"></div><div class="screen" id="screen">SYSTEM OFFLINE<br><br>Find the missing components.</div><div class="desk"></div><div class="cab"></div><div class="panel">⚡</div><div class="vent">▤</div><button class="hot h-screen" data-o="screen"></button><button class="hot h-desk" data-o="desk"></button><button class="hot h-cab" data-o="cab"></button><button class="hot h-panel" data-o="panel"></button><button class="hot h-vent" data-o="vent"></button></section><div class="inventory" id="inv"></div><div class="msg" id="msg">🔎 Tap objects to investigate. Useful items will enter your inventory.</div></main><div class="modal hidden" id="modal"><div class="card"><h2 id="mt"></h2><p id="md"></p><div id="mc"></div><button class="btn" id="close">Close</button></div></div>
<script>
const s={items:[],power:0,hints:3,selected:null,battery:false,wire:false,lens:false,chip:false,terminal:false,door:false,screenSolved:false};
const $=x=>document.getElementById(x), say=t=>$('msg').textContent=t;
function inv(){ $('count').textContent=s.items.length;$('power').textContent=s.power+'%';$('hints').textContent=s.hints;$('inv').innerHTML=s.items.map(x=>'<button class="item '+(s.selected===x?'sel':'')+'" data-i="'+x+'">'+({battery:'🔋 Battery',wire:'🧵 Wire',lens:'🔍 Lens',chip:'💾 Chip',key:'🗝️ Key'}[x])+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{s.selected=b.dataset.i;inv();say('Selected '+b.textContent+'. Now tap something you want to use it on.');})}
function add(x,text){if(!s.items.includes(x)){s.items.push(x);say(text);inv()}}
function modal(t,d,html){$('mt').textContent=t;$('md').textContent=d;$('mc').innerHTML=html;$('modal').classList.remove('hidden')}
function inspect(o){
if(o==='desk'){if(!s.battery){s.battery=true;add('battery','🔋 You found a battery under the desk.');}else say('The desk is empty.');}
if(o==='vent'){if(!s.lens){s.lens=true;add('lens','🔍 A tiny optical lens was hidden behind the vent.');}else say('Only dust remains in the vent.');}
if(o==='cab'){if(s.selected==='wire'&&!s.wire){s.wire=true;s.items=s.items.filter(x=>x!=='wire');s.power=40;inv();say('🧵 You repaired the cabinet circuit. Power restored to 40%.');}else if(!s.wire){add('wire','🧵 You found a loose insulated wire inside the cabinet.');}else say('The cabinet circuit is repaired.');}
if(o==='panel'){if(s.selected==='battery'&&!s.battery){say('You do not have that.')}else if(s.battery&&!s.wire){say('⚡ The panel has no power. Repair the cabinet circuit first.')}else if(s.battery&&s.wire&&!s.chip){s.chip=true;s.items=s.items.filter(x=>x!=='battery');s.power=75;inv();say('💾 The powered panel releases a security chip.');}else say('The panel is already open.');}
if(o==='screen'){if(s.selected==='lens'&&!s.screenSolved){modal('Optical Decoder','Use the lens to reveal the hidden sequence. Choose the symbols in the order shown.', '<div class="choices">'+['▲','●','◆','■'].map((x,i)=>'<button class="choice" data-c="'+i+'">'+x+'</button>').join('')+'</div>');let order=[2,0,3,1],step=0;document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(+b.dataset.c===order[step]){step++;b.disabled=true;if(step===4){s.screenSolved=true;$('modal').classList.add('hidden');$('screen').innerHTML='SIGNAL RESTORED<br><br>HATCH CODE: 4816';say('🛰️ The terminal decrypts the emergency hatch code: 4816.')}}else{step=0;document.querySelectorAll('[data-c]').forEach(x=>x.disabled=false);say('❌ Wrong symbol. The sequence resets.')}})}else if(!s.screenSolved)say('🖥️ The terminal is offline. You need power, then the optical lens.');else modal('Emergency Hatch','Enter the decrypted code.','<input id="code" inputmode="numeric" maxlength="4" style="width:100%;padding:12px;font-size:20px"><br><br><button class="btn" id="unlock">Unlock Hatch</button>');}}
document.querySelectorAll('.hot').forEach(b=>b.onclick=()=>inspect(b.dataset.o));$('close').onclick=()=>$('modal').classList.add('hidden');$('restart').onclick=()=>location.reload();
$('hint').onclick=()=>{if(!s.hints){say('No hints left.');return}s.hints--;inv();let t=!s.battery?'Search the desk.':!s.wire?'Search the cabinet for a wire.':!s.chip?'Repair the cabinet, then use the powered panel.':!s.screenSolved?'Use the lens on the terminal.':'Use the decrypted code at the terminal.';say('💡 '+t)};
document.addEventListener('click',e=>{if(e.target.id==='unlock'){if($('code').value==='4816'){s.door=true;$('modal').classList.add('hidden');say('🚨 HATCH UNLOCKED! You escaped the research station! 🏆');}else say('❌ Incorrect hatch code.');}});
inv();
</script></body></html>
