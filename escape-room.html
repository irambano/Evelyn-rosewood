<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Escape Room</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100d0a;color:#f8efe2;font-family:Arial,sans-serif}body{padding:16px}.game{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#211912;border:1px solid #8c6944;border-radius:16px;padding:8px 12px;font-size:14px;font-weight:bold}h1{font-size:clamp(30px,8vw,48px);margin:8px 0;color:#f1c77a}.sub{color:#cdbda8}.room{position:relative;aspect-ratio:16/10;border:2px solid #725238;border-radius:20px;overflow:hidden;background:linear-gradient(#302117 0 13%,#493423 13% 70%,#21160f 70%)}.wall{position:absolute;inset:13% 0 30%;background:radial-gradient(circle at 50% 20%,#5b432f,#2b1e15 70%)}.floor{position:absolute;inset:auto 0 0;height:30%;background:repeating-linear-gradient(90deg,#24170f 0 8%,#2e1d13 8% 16%);border-top:3px solid #694a30}.obj{position:absolute;border:2px solid #b68a55;background:#3b291b;color:#fff;border-radius:12px;min-width:58px;min-height:48px;padding:8px;cursor:pointer;font-size:25px;display:grid;place-items:center;box-shadow:0 5px 12px #0006}.obj small{font-size:10px;color:#dbc6a9}.obj:focus{outline:3px solid #f1c77a}.painting{left:9%;top:27%;width:82px;height:70px}.clock{left:43%;top:20%;border-radius:50%;width:68px;height:68px}.books{right:9%;top:27%;height:95px;width:72px}.desk{left:38%;bottom:10%;width:150px;height:58px}.safe{right:10%;bottom:10%;width:82px;height:68px}.door{left:4%;bottom:10%;width:65px;height:105px;border-radius:8px}#message{margin:12px 0;background:#1b140f;border:1px solid #76563a;border-radius:14px;padding:12px;min-height:48px;line-height:1.4}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #a57a45;background:#3a2919;color:#fff;border-radius:12px;padding:11px 15px;font-weight:bold;cursor:pointer}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:5}.card{width:min(440px,100%);background:#1b130d;border:1px solid #a57a45;border-radius:20px;padding:22px}.card h2{margin-top:0;color:#f1c77a}.card input{width:100%;padding:13px;border-radius:10px;border:1px solid #8c6944;background:#0f0b08;color:#fff;font-size:20px;text-align:center;letter-spacing:6px}.hidden{display:none!important}@media(max-width:430px){.obj{font-size:20px;min-width:50px;min-height:44px}.painting{left:7%;top:29%}.books{right:6%;top:29%}.desk{left:31%;width:120px}.safe{right:5%}}</style></head><body><main class="game"><h1>🔐 Escape Room</h1><p class="sub">Point, click and solve. No walking around. Every object hides part of the mystery.</p><div class="top"><div class="pill">❤️ Lives: <span id="lives">3</span></div><div class="pill">🧩 Clues: <span id="clues">0</span>/4</div><div class="pill">🗝️ Key: <span id="key">No</span></div></div><section class="room"><div class="wall"></div><div class="floor"></div><button class="obj painting" data-object="painting">🖼️<small>Painting</small></button><button class="obj clock" data-object="clock">🕰️</button><button class="obj books" data-object="books">📚<small>Books</small></button><button class="obj desk" data-object="desk">🗄️<small>Desk</small></button><button class="obj safe" data-object="safe">🔐<small>Safe</small></button><button class="obj door" data-object="door">🚪<small>EXIT</small></button></section><div id="message" aria-live="polite">🔎 The room is quiet. Something is hidden here...</div><div class="actions"><button class="btn" id="reset" type="button">🔄 Restart</button><button class="btn" id="hint" type="button">💡 Hint</button></div></main><div id="modal" class="modal hidden"><div class="card"><h2>🔐 Safe Code</h2><p>Enter the four-digit code hidden in the room.</p><input id="codeInput" inputmode="numeric" maxlength="4" aria-label="Four digit code"><div class="actions" style="margin-top:12px"><button class="btn" id="submitCode" type="button">Unlock</button><button class="btn" id="closeModal" type="button">Cancel</button></div></div></div>
<script>
const s={lives:3,found:new Set(),key:false,safe:false,done:false},$=id=>document.getElementById(id),msg=t=>{$('message').textContent=t;$('clues').textContent=s.found.size;$('lives').textContent=s.lives;$('key').textContent=s.key?'Yes':'No'};
function inspect(o){if(s.done)return;if(o==='painting'&&!s.found.has(o)){s.found.add(o);msg('🖼️ Behind the painting: “The first digit is 7.”')}else if(o==='clock'&&!s.found.has(o)){s.found.add(o);msg('🕰️ The stopped clock reads 3:00. “The second digit is 3.”')}else if(o==='books'&&!s.found.has(o)){s.found.add(o);msg('📚 An upside-down book says NINE. “The third digit is 9.”')}else if(o==='desk'&&!s.found.has(o)){s.found.add(o);msg('🗄️ A note in the drawer says: “The final digit is 1.”')}else if(o==='safe'){if(s.safe)msg('🔓 The safe is empty. You already have its key.');else if(s.found.size<4)msg('🔐 Locked. Find all four clues first.');else{$('modal').classList.remove('hidden');$('codeInput').value='';$('codeInput').focus()}}else if(o==='door'){if(s.key){s.done=true;msg('🏆 ESCAPE SUCCESS! You solved the room and got out!');document.querySelectorAll('.obj').forEach(b=>b.disabled=true)}else msg('🚪 Locked. The key must be inside the safe.')}else msg('🔎 Nothing new here.');}
document.querySelectorAll('[data-object]').forEach(b=>b.addEventListener('click',()=>inspect(b.dataset.object)));
$('submitCode').addEventListener('click',()=>{if($('codeInput').value==='7391'){s.safe=true;s.key=true;$('modal').classList.add('hidden');msg('🗝️ Correct! The safe opens and you find the exit key.')}else{s.lives--; $('modal').classList.add('hidden');msg(s.lives?'❌ Wrong code. You lost a life.':'💀 You ran out of lives. Press Restart.');if(!s.lives)document.querySelectorAll('.obj').forEach(b=>b.disabled=true)}});
$('closeModal').addEventListener('click',()=>$('modal').classList.add('hidden'));$('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('submitCode').click()});
$('hint').addEventListener('click',()=>{const a=[['painting','Inspect the painting.'],['clock','The clock is stopped for a reason.'],['books','One book is different.'],['desk','Search the desk drawer.']].find(q=>!s.found.has(q[0]));msg('💡 '+(a?a[1]:(s.found.size===4?'Try the safe.':'Find the hidden clues.')))});
$('reset').addEventListener('click',()=>location.reload());msg('🔎 The room is quiet. Something is hidden here...');
</script></body></html>
