<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Escape Room: The Lost Key</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#eee;font-family:system-ui,Arial;padding:12px}.game{max-width:850px;margin:auto}h1{margin:5px 0;color:#8de7ff}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill,.btn{background:#171d2b;border:1px solid #40506d;color:#fff;border-radius:12px;padding:9px 12px}.btn{cursor:pointer}.btn.active{border-color:#8de7ff;box-shadow:0 0 12px #8de7ff44}.scene{position:relative;aspect-ratio:16/9;overflow:hidden;border:2px solid #40506d;border-radius:18px;background:#1c2634}.scene.library{background:linear-gradient(#24384b 0 64%,#17151b 64%)}.scene.workshop{background:linear-gradient(#3a2a22 0 64%,#17110e 64%)}.scene.vault{background:linear-gradient(#25283a,#11131e)}.hot{position:absolute;background:#0b111acc;border:2px solid #7188a8;color:white;border-radius:10px;padding:10px;cursor:pointer;font-size:24px}.hot small{display:block;font-size:11px}.desk{left:35%;bottom:9%;width:30%}.books{left:8%;top:27%;width:16%}.painting{right:9%;top:24%;width:17%}.lamp{left:42%;top:23%}.door{right:4%;bottom:9%;height:48%;width:13%}.chest{left:18%;bottom:9%;width:17%}.machine{right:8%;top:27%;width:22%}.panel{left:39%;top:31%;width:22%}.screen{position:absolute;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:4}.card{width:min(470px,100%);background:#121927;border:1px solid #6b819f;border-radius:18px;padding:20px}.card h2{color:#8de7ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{padding:15px;font-size:20px;background:#202b3d;color:#fff;border:1px solid #536985;border-radius:9px}.inv{display:flex;gap:7px;overflow:auto;padding:8px 0;min-height:58px}.item{white-space:nowrap}.log{background:#101620;border:1px solid #303e54;border-radius:12px;padding:10px;min-height:48px;margin:8px 0}.hidden{display:none!important}.nav{display:flex;gap:8px;margin-top:8px}.nav button{flex:1}@media(max-width:500px){.hot{font-size:19px;padding:7px}.hot small{font-size:9px}}
</style></head><body><main class="game"><h1>🗝️ Escape Room: The Lost Key</h1><div class="bar"><span class="pill">🧩 Puzzles: <b id="progress">0</b>/5</span><span class="pill">🎒 Inventory: <b id="count">0</b></span><button class="btn" id="hint">💡 Hint</button><button class="btn" id="restart">🔄 Restart</button></div><div id="scene" class="scene library"><button class="hot books" data-act="books">📚<small>Bookshelf</small></button><button class="hot painting" data-act="painting">🖼️<small>Painting</small></button><button class="hot lamp" data-act="lamp">💡<small>Lamp</small></button><button class="hot desk" data-act="desk">🗄️<small>Desk</small></button><button class="hot door" data-act="door">🚪<small>Exit</small></button></div><div id="log" class="log">You wake up in a strange study. The exit is locked. Explore the room.</div><div class="inv" id="inv"></div><div class="nav"><button class="btn" id="work">➡️ Workshop</button><button class="btn hidden" id="vault">➡️ Hidden Vault</button></div></main><div id="modal" class="screen hidden"><div class="card" id="card"></div></div>
<script>
let S={room:'library',items:[],puzzles:0,book:false,lamp:false,drawer:false,gear:false,chip:false,door:false,code:false};const $=x=>document.getElementById(x);
function log(t){$('log').textContent=t;render()}function has(x){return S.items.includes(x)}function add(x){if(!has(x)){S.items.push(x);log('🎒 You found: '+x)}}function render(){ $('progress').textContent=S.puzzles;$('count').textContent=S.items.length;$('inv').innerHTML=S.items.map(x=>'<span class="pill item">🎒 '+x+'</span>').join(''); $('scene').className='scene '+S.room;$('work').classList.toggle('hidden',S.room!=='library');$('vault').classList.toggle('hidden',!S.gear||S.room!=='workshop');}
function modal(html){$('card').innerHTML=html;$('modal').classList.remove('hidden')}function close(){ $('modal').classList.add('hidden')}
function library(a){if(a==='books'){if(!S.book){modal('<h2>📚 Bookshelf</h2><p>Three books have symbols: ★, ●, ▲. A note says: “Read them in the order shown on the desk.”</p><button class="btn" onclick="solveBooks()">Take the note</button>')}else log('The bookshelf is empty of useful clues.')}
else if(a==='painting'){if(!S.lamp){log('🖼️ The painting has a tiny scratched line: “Light reveals what eyes miss.”')}else{add('metal gear');S.gear=true;S.puzzles=Math.max(S.puzzles,2);log('🖼️ The lamp shines through the painting. A metal gear drops out!')}}else if(a==='lamp'){if(!S.lamp){modal('<h2>💡 Lamp</h2><p>The lamp has three switches. Turn on the correct sequence.</p><div class="grid">'+[1,2,3].map(n=>'<button onclick="lamp('+n+')">'+n+'</button>').join('')+'</div><p>Hint: the bookshelf symbols are ★ ● ▲, and the switch symbols are hidden on the lamp.</p>')}else log('The lamp is already on.')}else if(a==='desk'){if(!S.book){log('🗄️ The desk drawer is locked. Maybe a clue elsewhere tells you the order.')}else if(!S.drawer){modal('<h2>🗄️ Desk Drawer</h2><p>Enter the symbol order as numbers: ★=1, ●=2, ▲=3.</p><input id="inp" maxlength="3" inputmode="numeric" style="width:100%;padding:12px;font-size:20px"><br><br><button class="btn" onclick="drawer()">Unlock</button>')}else log('The desk is already searched.')}else if(a==='door'){if(S.code){S.door=true;modal('<h2>🎉 YOU ESCAPED!</h2><p>You solved the chained puzzles, opened the hidden vault and recovered the lost key.</p><button class="btn" onclick="close()">Play again later</button>')}else log('🚪 Locked. The real key is not in this room yet.')} }
function solveBooks(){S.book=true;S.puzzles=1;close();log('📜 You take the note. It shows the order ★ ● ▲.')}function lamp(n){if(n===2){S.lamp=true;S.puzzles=Math.max(S.puzzles,2);close();log('💡 Click! The lamp is now on. Try the painting.')}else log('❌ Nothing happens. Try another switch.')}
function drawer(){if($('inp').value==='123'){S.drawer=true;S.puzzles=3;close();add('brass key');log('🔑 The drawer opens. You find a brass key and a note: “Workshop first.”')}else log('❌ Wrong order.')}
function workshop(a){if(a==='machine'){if(has('brass key')){add('security chip');S.chip=true;S.puzzles=4;log('⚙️ The brass key starts the machine. It prints a security chip.')}else log('⚙️ The machine has a key-shaped slot.')}}else if(a==='panel'){if(S.chip){modal('<h2>🖥️ Security Panel</h2><p>Insert the chip, then solve the pattern.</p><div class="grid">'+['◆','○','▲','○','◆','▲'].map((x,i)=>'<button onclick="pattern('+i+')">'+x+'</button>').join('')+'</div>')}else log('🖥️ The panel needs a security chip.')}}else if(a==='chest'){log('📦 The chest is sealed by a symbol lock. The pattern may be in the workshop.')}} 
function pattern(i){if(i===5){S.code=true;S.puzzles=5;close();add('lost key');log('🔓 The panel opens! A hidden compartment contains the LOST KEY. Return to the library exit.')}else log('❌ Wrong symbol. Look for the pattern clue.')}
function showRoom(r){S.room=r;$('scene').innerHTML=r==='library'?'<button class="hot books" data-act="books">📚<small>Bookshelf</small></button><button class="hot painting" data-act="painting">🖼️<small>Painting</small></button><button class="hot lamp" data-act="lamp">💡<small>Lamp</small></button><button class="hot desk" data-act="desk">🗄️<small>Desk</small></button><button class="hot door" data-act="door">🚪<small>Exit</small></button>':'<button class="hot machine" data-act="machine">⚙️<small>Machine</small></button><button class="hot panel" data-act="panel">🖥️<small>Security Panel</small></button><button class="hot chest" data-act="chest">📦<small>Chest</small></button>';document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>r==='library'?library(b.dataset.act):workshop(b.dataset.act));render()}
document.getElementById('work').onclick=()=>showRoom('workshop');document.getElementById('vault').onclick=()=>showRoom('workshop');document.getElementById('hint').onclick=()=>log(!S.book?'💡 Find the clue that gives you the symbol order.':!S.lamp?'💡 Solve the lamp switches.':!S.drawer?'💡 Use the symbol order at the desk.':!S.gear?'💡 Use the brass key in the workshop machine.':!S.code?'💡 Put the security chip into the panel.':'💡 Return to the exit.');document.getElementById('restart').onclick=()=>location.reload();showRoom('library');
</script></body></html>
