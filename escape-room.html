<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Escape Room: Temple of the Lost Star</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f5f1e8;font-family:system-ui,Arial;padding:10px}.game{max-width:900px;margin:auto}h1{margin:4px 0;color:#ffd66b;font-size:clamp(25px,7vw,42px)}.story{color:#c9d1df;margin:4px 0 10px}.bar{display:flex;gap:7px;flex-wrap:wrap}.pill,.btn{background:#141b29;border:1px solid #475b78;color:#fff;border-radius:12px;padding:9px 12px}.btn{cursor:pointer}.scene{position:relative;aspect-ratio:16/9;overflow:hidden;border:2px solid #52657f;border-radius:18px;margin-top:10px;box-shadow:0 10px 35px #0008}.jungle{background:linear-gradient(#142d25 0 55%,#182016 55%)}.temple{background:linear-gradient(#3c3024 0 65%,#1b1613 65%)}.cave{background:linear-gradient(#24253a,#0b0c15)}.bridge{background:linear-gradient(#183047 0 60%,#121820 60%)}.hot{position:absolute;background:#090d14dd;border:2px solid #7084a2;color:#fff;border-radius:11px;padding:9px;cursor:pointer;font-size:23px;box-shadow:0 4px 12px #0008}.hot small{display:block;font-size:10px}.ruins{left:7%;top:27%;width:20%}.statue{right:8%;top:25%;width:17%}.torch{left:43%;top:22%}.gate{right:4%;bottom:8%;height:55%;width:14%}.chest{left:34%;bottom:9%;width:18%}.altar{left:40%;top:27%;width:20%}.crystal{right:9%;top:24%;width:18%}.lever{left:10%;bottom:12%;width:16%}.bridgeObj{left:39%;bottom:13%;width:23%}.map{left:7%;top:25%;width:17%}.journal{right:7%;bottom:10%;width:19%}.log{margin:9px 0;background:#0f1520;border:1px solid #35445b;border-radius:12px;padding:11px;min-height:55px}.inv{display:flex;gap:6px;overflow:auto;min-height:55px;padding:5px 0}.screen{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.card{width:min(480px,100%);background:#121a28;border:1px solid #627894;border-radius:18px;padding:20px}.card h2{color:#ffd66b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{padding:16px;font-size:21px;background:#202c40;color:#fff;border:1px solid #5b718e;border-radius:10px}.input{width:100%;padding:12px;background:#080d15;color:white;border:1px solid #5c718d;border-radius:9px;font-size:20px;text-align:center}.hidden{display:none!important}.danger{color:#ff7f7f;font-weight:bold}@media(max-width:500px){.hot{font-size:19px;padding:7px}.hot small{font-size:9px}}
</style></head><body><main class="game"><h1>🗺️ Temple of the Lost Star</h1><p class="story">A storm has trapped you inside an ancient jungle temple. Somewhere beyond the ruins is the legendary Star Chamber. Find it before the temple seals forever.</p><div class="bar"><span class="pill">❤️ <b id="lives">3</b></span><span class="pill">⏳ <b id="timer">90</b>s</span><span class="pill">⭐ <b id="stars">0</b>/3</span><button class="btn" id="hint">💡 Hint</button><button class="btn" id="restart">🔄 Restart</button></div><div id="scene" class="scene jungle"></div><div id="log" class="log">🌧️ Thunder rolls overhead. The jungle path ends at a ruined temple. Find a way inside.</div><div class="inv" id="inv"></div></main><div id="modal" class="screen hidden"><div class="card" id="card"></div></div>
<script>
let S={area:'jungle',items:[],stars:0,lives:3,time:90,started:true,gate:false,torch:false,map:false,stone:false,lever:false,crystal:false,door:false,done:false};const $=x=>document.getElementById(x);
function has(x){return S.items.includes(x)}function add(x){if(!has(x))S.items.push(x)}function log(t){$('log').innerHTML=t;render()}function render(){$('lives').textContent=S.lives;$('timer').textContent=S.time;$('stars').textContent=S.stars;$('inv').innerHTML=S.items.map(x=>'<span class="pill">🎒 '+x+'</span>').join('');draw()}
function modal(x){$('card').innerHTML=x;$('modal').classList.remove('hidden')}function close(){ $('modal').classList.add('hidden')}
function draw(){let h='';if(S.area==='jungle')h='<button class="hot map" data-a="map">🗺️<small>Explorer Bag</small></button><button class="hot ruins" data-a="ruins">🏛️<small>Temple Gate</small></button><button class="hot journal" data-a="journal">📓<small>Journal</small></button>';if(S.area==='temple')h='<button class="hot statue" data-a="statue">🗿<small>Statue</small></button><button class="hot torch" data-a="torch">🔥<small>Torch</small></button><button class="hot chest" data-a="chest">📦<small>Stone Chest</small></button><button class="hot gate" data-a="gate">🚪<small>Temple Gate</small></button>';if(S.area==='cave')h='<button class="hot altar" data-a="altar">⭐<small>Star Altar</small></button><button class="hot crystal" data-a="crystal">💎<small>Crystal</small></button><button class="hot lever" data-a="lever">🪝<small>Lever</small></button>';if(S.area==='bridge')h='<button class="hot bridgeObj" data-a="bridge">🌉<small>Rope Bridge</small></button><button class="hot journal" data-a="idol">🗿<small>Idol</small></button>';if(S.area==='star')h='<button class="hot altar" data-a="final">🌟<small>Star Chamber</small></button>';$('scene').className='scene '+S.area;$('scene').innerHTML=h;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a))}

function act(a){
if(S.done)return;
if(S.area==='jungle'){
if(a==='map'){if(!S.map){S.map=true;add('old map');log('🗺️ The map shows a hidden route: Temple → Cave → Rope Bridge. A red X marks a crystal.')}else log('🗺️ The route is clear.')}
if(a==='journal')log('📓 Explorer note: “The temple responds to light. Three stars open the inner path.”')
if(a==='ruins'){if(!S.map)log('🏛️ The gate is covered in vines. You need a route map to spot the hidden latch.');else{S.area='temple';log('🏛️ You pull the hidden latch. The stone gate groans open.')}}}
else if(S.area==='temple'){
if(a==='statue'){modal('<h2>🗿 The Guardian</h2><p>Its inscription reads: “Only the sun wakes the stone.” Three symbols glow faintly.</p><div class="grid"><button onclick="guardian(1)">☀️</button><button onclick="guardian(2)">🌙</button><button onclick="guardian(3)">🔥</button></div>')}
if(a==='torch'){if(S.torch)log('🔥 Your torch is burning.');else{S.torch=true;add('lit torch');log('🔥 You light the torch. Shadows move behind the statue.')}} 
if(a==='chest'){if(!S.stone)modal('<h2>📦 Stone Chest</h2><p>A lock has three symbols. The journal says the temple responds to light.</p><div class="grid"><button onclick="chest(1)">☀️</button><button onclick="chest(2)">🔥</button><button onclick="chest(3)">⭐</button></div>');else log('📦 The chest is empty.')}
if(a==='gate'){if(S.stone){S.area='cave';log('🕳️ The inner gate opens. Cold air rushes from a hidden cave.')}else log('🚪 The inner gate needs the stone key from the chest.')}} 
else if(S.area==='cave'){
if(a==='crystal'){if(!S.crystal){S.crystal=true;add('blue crystal');S.stars=1;log('💎 You take the blue crystal. It pulses like a heartbeat.')}else log('💎 Only the crystal socket remains.')}
if(a==='altar'){if(!S.crystal)log('⭐ The altar has three empty sockets. Find the crystal.');else modal('<h2>⭐ Star Altar</h2><p>Place the crystal and choose the constellation path.</p><div class="grid"><button onclick="constellation(1)">🦅</button><button onclick="constellation(2)">🐍</button><button onclick="constellation(3)">🦁</button></div>')}
if(a==='lever'){if(S.lever){S.area='bridge';log('🌉 A hidden passage opens onto a broken rope bridge.')}else if(S.torch){S.lever=true;add('iron lever');S.stars=2;log('🪝 You pull the lever with the torchlight. A passage opens.')}else log('🪝 Something is hidden in the darkness. You need light.')}} 
else if(S.area==='bridge'){
if(a==='bridge'){if(S.lever){modal('<h2>🌉 Rope Bridge</h2><p>The bridge is missing planks. Choose the safe pattern: 2, 1, 3.</p><div class="grid"><button onclick="bridge(2)">2</button><button onclick="bridge(1)">1</button><button onclick="bridge(3)">3</button></div>')}else log('🌉 The bridge mechanism is jammed.')}
if(a==='idol'){if(has('iron lever')){add('golden key');S.stars=3;log('🗿 The idol opens after you use the lever. A golden key falls out!')}else log('🗿 The idol has a lever-shaped socket.')}} 
else if(S.area==='star'){if(a==='final')finish()}
}
function guardian(n){if(n===1){close();S.stars=1;log('☀️ The Guardian awakens and points toward the chest.')}else log('❌ The symbols reject your choice.')}
function chest(n){if(n===1&&S.torch){close();S.stone=true;add('stone key');log('🔑 The chest clicks open. Inside: a carved stone key.')}else log('❌ The lock stays cold. Light and the sun symbol must be connected.')}
function constellation(n){if(n===2){close();S.stars=Math.max(S.stars,1);log('🐍 The crystal flashes. A secret lever is revealed!')}else log('❌ The constellation fades.')}
function bridge(n){if(n===2){modal('<h2>🌉 Step carefully!</h2><p>Next plank?</p><div class="grid"><button onclick="bridge2(1)">1</button><button onclick="bridge2(2)">2</button><button onclick="bridge2(3)">3</button></div>')}else log('💥 The plank snaps!');}
function bridge2(n){if(n===1){modal('<h2>🌉 Almost there!</h2><p>Final plank?</p><div class="grid"><button onclick="bridge3(3)">3</button><button onclick="bridge3(1)">1</button></div>')}else log('💥 You step on a rotten plank!')}
function bridge3(n){if(n===3){close();S.area='star';log('🌟 You cross the bridge and enter a chamber filled with golden light.')}else log('💥 Wrong plank!')}
function finish(){if(has('golden key')){S.done=true;modal('<h2>🏆 THE LOST STAR</h2><p>You unlock the Star Chamber. The legendary treasure rises from the floor as the temple begins to collapse.</p><p>🏃 You escape into the jungle with the Lost Star!</p><button class="btn" onclick="close()">🎉 Victory</button>')}else log('🌟 The chamber is locked. The idol key is still missing.')}
$('hint').onclick=()=>{let t=!S.map?'💡 Search the explorer bag.':!S.torch?'💡 The temple inscription mentions light.':!S.stone?'💡 Light + sun symbol may open the chest.':!S.crystal?'💡 Look for the crystal in the cave.':!S.lever?'💡 Something in the cave reacts to your torch.':!has('golden key')?'💡 The idol may need the iron lever.':'💡 Cross the bridge and enter the Star Chamber.';log(t)};$('restart').onclick=()=>location.reload();
let timer=setInterval(()=>{if(!S.done&&S.time>0){S.time--;render();if(S.time===0){clearInterval(timer);modal('<h2>⏳ THE TEMPLE SEALED</h2><p>The ancient doors slam shut. Your expedition is over.</p><button class="btn" onclick="location.reload()">Try Again</button>')}}},1000);render();
</script></body></html>
