<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spy Mission</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07100d;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:10px;left:10px;right:10px;z-index:5;display:flex;gap:7px;justify-content:space-between;font-size:13px;font-weight:bold}
.p{background:#0c1c17dd;border:1px solid #68e0a455;border-radius:18px;padding:8px 10px}
#msg{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:5;background:#081711dd;border:1px solid #68e0a455;border-radius:16px;padding:8px 14px;text-align:center;font-size:13px}
#start,#end{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#030907f2;padding:20px;text-align:center}
.box{max-width:520px;padding:28px;border:1px solid #68e0a455;border-radius:25px;background:#0a1712;box-shadow:0 0 70px #35d47b18}
h1{font-size:clamp(34px,9vw,58px);margin:7px 0;color:#79f0ad}p{color:#c8d8d0;line-height:1.5}
button{border:1px solid #69e7a677;background:#123d2a;color:white;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:bold}
#controls{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10}
.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:7px}
.c{width:58px;height:58px;padding:0;background:#123b2add;font-size:23px}
.u{grid-column:2}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}
.hidden{display:none!important}
</style></head><body>
<div id="hud"><div class="p">❤️ <span id="hp">3</span></div><div class="p">📁 <span id="files">0</span>/3</div><div class="p">🚨 <span id="alarm">0</span>%</div><div class="p">⭐ <span id="score">0</span></div></div>
<div id="msg">Mission: collect all 3 files.</div><canvas id="c"></canvas>
<div id="start"><div class="box"><div style="font-size:64px">🕵️‍♀️🔐</div><h1>SPY MISSION</h1><p>Infiltrate the vault, steal 3 secret files, avoid the guards and reach the extraction door.</p><p>Stay out of the red vision cones. If the alarm reaches 100%, the mission fails!</p><button onclick="begin()">▶ START MISSION</button></div></div>
<div id="end" class="hidden"><div class="box"><div id="ei" style="font-size:60px">🏆</div><h1 id="et">MISSION COMPLETE</h1><p id="ed"></p><button onclick="begin()">🔄 PLAY AGAIN</button></div></div>
<div id="controls"><div class="pad">
<button class="c u" data-k="u">▲</button><button class="c l" data-k="l">◀</button><button class="c d" data-k="d">▼</button><button class="c r" data-k="r">▶</button>
</div></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');let W,H,D,run=false,last=0,hp=3,files=0,alarm=0,score=0;const k={u:0,d:0,l:0,r:0};let p,guards,loot,walls,exit;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
document.querySelectorAll('[data-k]').forEach(b=>{let q=b.dataset.k;const d=e=>{e.preventDefault();set(q,1)};const u=e=>{e.preventDefault();set(q,0)};b.addEventListener('pointerdown',d);b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('lostpointercapture',u)});
function set(q,v){k[q]=v}
function begin(){Object.keys(k).forEach(q=>k[q]=0);hp=3;files=0;alarm=0;score=0;document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');
p={x:65,y:H-85,r:15,s:205};loot=[[W*.25,H*.22],[W*.72,H*.24],[W*.46,H*.62]].map(q=>({x:q[0],y:q[1],r:12,got:false}));
guards=[{x:W*.50,y:H*.23,r:16,a:0,s:48,range:145,phase:0},{x:W*.72,y:H*.65,r:16,a:Math.PI,s:42,range:155,phase:2}];
walls=[{x:W*.15,y:H*.38,w:W*.28,h:18},{x:W*.57,y:H*.38,w:W*.27,h:18},{x:W*.38,y:H*.72,w:18,h:H*.16}];exit={x:W-58,y:78,r:25};last=performance.now();run=true;document.getElementById('msg').textContent='Mission: collect all 3 files.';requestAnimationFrame(loop)}
function blocked(o,nx,ny){if(nx<o.r||nx>W-o.r||ny<o.r+45||ny>H-o.r-5)return true;return walls.some(r=>{let a=Math.max(r.x,Math.min(nx,r.x+r.w)),b=Math.max(r.y,Math.min(ny,r.y+r.h));return Math.hypot(nx-a,ny-b)<o.r})}
function move(dt){let dx=k.r-k.l,dy=k.d-k.u;if(!dx&&!dy)return;let z=Math.hypot(dx,dy);dx/=z;dy/=z;let nx=p.x+dx*p.s*dt,ny=p.y+dy*p.s*dt;if(!blocked(p,nx,p.y))p.x=nx;if(!blocked(p,p.x,ny))p.y=ny}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function lineClear(g){let dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy),steps=Math.ceil(d/18);for(let i=1;i<steps;i++){let qx=g.x+dx*i/steps,qy=g.y+dy*i/steps;if(walls.some(r=>qx>r.x&&qx<r.x+r.w&&qy>r.y&&qy<r.y+r.h))return false}return true}
function update(dt){move(dt);
loot.forEach(f=>{if(!f.got&&dist(p,f)<p.r+f.r){f.got=true;files++;score+=200}});
guards.forEach(g=>{g.a+=dt*.55;let d=dist(p,g);let angle=Math.atan2(p.y-g.y,p.x-g.x);let facing=Math.atan2(Math.sin(g.a),Math.cos(g.a));let diff=Math.abs(Math.atan2(Math.sin(angle-facing),Math.cos(angle-facing)));let seen=d<g.range&&diff<.68&&lineClear(g);if(seen){alarm+=dt*31;document.getElementById('msg').textContent='⚠️ SPOTTED! RUN TO COVER!';}else{g.x+=Math.cos(g.a)*g.s*dt*.55;g.y+=Math.sin(g.a)*g.s*dt*.55;if(g.x<30||g.x>W-30)g.a=Math.PI-g.a;if(g.y<70||g.y>H-30)g.a=-g.a}
if(d<p.r+g.r){hp--;p.x=65;p.y=H-85;alarm=Math.min(100,alarm+18);g.x+=70}
});
alarm=Math.max(0,alarm-dt*5);
if(files===3)document.getElementById('msg').textContent='✅ All files secured. Reach the extraction door!';
if(files===3&&dist(p,exit)<55){run=false;score+=500;finish(true)}
if(hp<=0||alarm>=100){run=false;finish(false)}
document.getElementById('hp').textContent=hp;document.getElementById('files').textContent=files;document.getElementById('alarm').textContent=Math.ceil(alarm);document.getElementById('score').textContent=score}
function draw(){x.fillStyle='#07100d';x.fillRect(0,0,W,H);
x.strokeStyle='#123024';for(let a=0;a<W;a+=34){x.beginPath();x.moveTo(a,45);x.lineTo(a,H);x.stroke()}for(let a=45;a<H;a+=34){x.beginPath();x.moveTo(0,a);x.lineTo(W,a);x.stroke()}
walls.forEach(r=>{x.fillStyle='#15382a';x.fillRect(r.x,r.y,r.w,r.h)});
x.fillStyle='#1e5b3c';x.beginPath();x.arc(exit.x,exit.y,exit.r,0,7);x.fill();x.fillStyle='#fff';x.font='22px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('🚪',exit.x,exit.y);
loot.forEach(f=>{if(!f.got){x.fillStyle='#f1c84b';x.shadowBlur=18;x.shadowColor='#f1c84b';x.fillRect(f.x-10,f.y-7,20,14);x.shadowBlur=0;x.fillStyle='#172016';x.fillText('📁',f.x,f.y)}});
guards.forEach(g=>{x.save();x.translate(g.x,g.y);x.rotate(g.a);x.fillStyle='#ff4057';x.globalAlpha=.18;x.beginPath();x.moveTo(0,0);x.arc(0,0,g.range,-.68,.68);x.closePath();x.fill();x.globalAlpha=1;x.fillStyle='#e94455';x.beginPath();x.arc(0,0,g.r,0,7);x.fill();x.restore();x.fillStyle='#fff';x.fillText('👮',g.x,g.y)});
x.fillStyle='#79f0ad';x.shadowBlur=18;x.shadowColor='#35d47b';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.fillText('🕵️',p.x,p.y)}
function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function finish(win){document.getElementById('end').classList.remove('hidden');document.getElementById('ei').textContent=win?'🏆':'🚨';document.getElementById('et').textContent=win?'EXTRACTION SUCCESS':'MISSION FAILED';document.getElementById('ed').textContent=win?'You stole all 3 files and escaped! Final score: '+score+' 🎉':'The security system caught you. Final score: '+score+'. Try a quieter approach!'}
addEventListener('keydown',e=>{let a=e.key.toLowerCase();if(a==='w'||a==='arrowup')k.u=1;if(a==='s'||a==='arrowdown')k.d=1;if(a==='a'||a==='arrowleft')k.l=1;if(a==='d'||a==='arrowright')k.r=1});
addEventListener('keyup',e=>{let a=e.key.toLowerCase();if(a==='w'||a==='arrowup')k.u=0;if(a==='s'||a==='arrowdown')k.d=0;if(a==='a'||a==='arrowleft')k.l=0;if(a==='d'||a==='arrowright')k.r=0});addEventListener('blur',()=>Object.keys(k).forEach(q=>k[q]=0));
</script></body></html>
