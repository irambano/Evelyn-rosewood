<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cybersecurity Games Hub</title><style>
:root{--bg:#060d1d;--panel:#112849;--line:#315c89;--a:#76f7d6;--p:#ff7cab;--gold:#ffd36c;--muted:#afc3de}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#275a8d 0,transparent 26%),radial-gradient(circle at 95% 90%,#174f5c 0,transparent 30%),linear-gradient(135deg,#07142a,#060c1b);color:#edf6ff;font:16px system-ui,Arial}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#74dbe522 1px,transparent 1px),linear-gradient(90deg,#74dbe522 1px,transparent 1px);background-size:28px 28px}.wrap{position:relative;max-width:1040px;margin:auto;padding:26px 18px}.hero{text-align:center;padding:22px 12px 10px}.eyebrow{display:inline-block;padding:7px 12px;border:1px solid #70f7d666;border-radius:99px;background:#102b4d;color:var(--a);font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.hero h1{color:#fff;font-size:clamp(2.3rem,7vw,4rem);letter-spacing:-.065em;line-height:1;margin:.35em auto;text-shadow:0 0 28px #4bf2ce55}.hero h1:first-letter{color:var(--a)}.hero p,.note{color:var(--muted)}.hero p{max-width:570px;margin:0 auto;line-height:1.55}.bar,.game,.card{background:linear-gradient(145deg,#16345cdd,#0e203ddd);border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:0 16px 35px #0005;backdrop-filter:blur(8px)}.bar{display:flex;justify-content:space-between;gap:12px;margin:18px 0 22px}.bar b{color:var(--gold);font-size:1.1em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}.card{position:relative;overflow:hidden;min-height:235px;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s,border-color .2s}.card:before{content:'';position:absolute;width:160px;height:160px;right:-55px;top:-65px;border-radius:50%;background:radial-gradient(circle,#76f7d633,transparent 68%)}.card:hover{transform:translateY(-5px);border-color:var(--a);box-shadow:0 22px 42px #0008}.tag{position:relative;color:var(--a);font-size:.8rem;font-weight:850;letter-spacing:.03em}.card h2{position:relative;font-size:1.4rem;margin:.7em 0 .35em}.card p{position:relative;min-height:50px;color:var(--muted);line-height:1.5;margin-top:0}.card button{margin-top:auto;position:relative;width:100%}button{border:0;border-radius:11px;background:linear-gradient(135deg,#81ffe0,#54d9c0);color:#062a23;font:inherit;font-weight:850;padding:12px 15px;cursor:pointer;box-shadow:0 4px 0 #208b78;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #208b78}button.secondary{background:#294d78;color:#fff;box-shadow:0 4px 0 #142b49}.danger{background:var(--p);color:#3c0920}.hidden{display:none!important}.game{max-width:800px;margin:auto;animation:rise .3s ease}.game h2{color:var(--a);font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:.4em}.lesson{border-left:4px solid var(--gold);background:#091b34cc;padding:13px 14px;border-radius:9px;margin:15px 0;line-height:1.5}.choices{display:grid;gap:10px;margin:17px 0}.choice{text-align:left;background:linear-gradient(135deg,#294f7d,#1f3e66);color:white;box-shadow:0 3px 0 #112946}.choice:hover{border-left:4px solid var(--a)}.good{background:#70e5a8!important;color:#073522!important}.bad{background:#ff98bc!important;color:#430b24!important}.email{background:#f6f8fc;color:#15223a;padding:15px;border-radius:10px}.terminal{background:#020914;color:#98ffd0;font-family:monospace;padding:14px;border-radius:10px;line-height:1.7}.meter{height:18px;background:#061121;border-radius:10px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#a6ffb9);width:100%;transition:.3s}.room{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.room button{min-height:100px;background:#29496f;color:#fff}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:520px){.wrap{padding:14px 12px}.bar{font-size:.8rem}.bar span:last-child{display:none}.room{grid-template-columns:1fr 1fr}.card{min-height:0}.hero{padding-top:10px}}
 .big{text-align:center;font-size:4.5rem;margin:8px}.center{text-align:center}.mission-path{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px auto 6px}.mission-path span{border:1px solid #63f5d655;background:#0d2948;border-radius:99px;padding:7px 11px;font-size:.78rem;font-weight:800;color:#d8faff}.mission-path b{color:var(--gold);margin-right:4px}.game-icon{position:relative;width:58px;height:58px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#2d6994,#183858);font-size:1.85rem;box-shadow:inset 0 1px #b8ffff55,0 8px 18px #02071366;margin-bottom:11px}.card:nth-child(2) .game-icon{background:linear-gradient(145deg,#744d9e,#34234e)}.card:nth-child(3) .game-icon{background:linear-gradient(145deg,#a05d4c,#4c292f)}.card:nth-child(4) .game-icon{background:linear-gradient(145deg,#338a71,#163f3b)}.card:after{content:'PLAY';position:absolute;right:14px;bottom:63px;font-size:.66rem;letter-spacing:.13em;color:#aefee9aa;font-weight:900}</style></head><body><main class="wrap"><header class="hero"><span class="eyebrow">Cyber safety mission</span><h1>Cybersecurity Games Hub</h1><p>Play four quick defense challenges, level up your score, and build smarter digital habits.</p><div class="mission-path"><span><b>01</b> Defuse</span><span><b>02</b> Investigate</span><span><b>03</b> Defend</span><span><b>04</b> Contain</span></div></header><div class="bar"><span>🏆 Total points: <b id="total">0</b></span><span>Learn • Defend • Stay safe</span></div><section id="home"><div class="grid" id="cards"></div></section><section id="play" class="hidden"><article class="game" id="game"></article></section></main><script>
const $=s=>document.querySelector(s);const games=[['bomb','💣','Cyber Bomb Defusal','Level 1 • Password safety','Choose the best account protection before time runs out.'],['hacker','🕵️','Find the Hacker','Level 2 • Incident response','Use harmless logs to locate unusual activity.'],['server','🖥️','Server Overload','Level 3 • Availability','Protect a pretend school server during a traffic spike.'],['malware','🧫','Malware Containment','Level 4 • Device hygiene','Safely contain a fictional infection.']];const levels=['bomb','hacker','server','malware'];let score=+localStorage.cyberHubScore||0,timer,active,lives,step,opened=0;function points(n){score+=n;localStorage.cyberHubScore=score;$('#total').textContent=score}function home(){clearInterval(timer);$('#play').classList.add('hidden');$('#home').classList.remove('hidden')}function shell(t,l,b){clearInterval(timer);delete $('#game').dataset.done;$('#home').classList.add('hidden');$('#play').classList.remove('hidden');$('#game').innerHTML=`<button class="secondary" onclick="home()">← Games menu</button><h2>${t}</h2><div class="lesson">💡 <b>Learn:</b> ${l}</div>${b}<div class="controls"><button class="secondary" onclick="start(active)">↻ Restart</button><button class="secondary" onclick="home()">Home</button></div>`}function complete(){shell('🏆 Mission Complete','You completed all four learning levels. Keep using these habits every day.',`<div class="big">🎉</div><p class="center">Excellent work, cyber defender! Your final score is <b>${score}</b>.</p><div class="controls"><button onclick="start('bomb')">Play Level 1 again</button></div>`)}function done(msg,n){clearInterval(timer);points(n);let i=levels.indexOf(active),next=levels[i+1];let action=next?`<button onclick="start('${next}')">Next level →</button>`:`<button onclick="complete()">Next level →</button>`;$('#game').insertAdjacentHTML('beforeend',`<div class="lesson"><b>${msg}</b>${n?' +'+n+' points.':''}<div class="controls">${action}</div></div>`)}function start(x){active=x;clearInterval(timer);({bomb,hacker,server,malware})[x]()}function choice(el,yes,good,bad,n=25){if($('#game').dataset.done)return;$('#game').dataset.done=1;el.classList.add(yes?'good':'bad');done(yes?good:bad,yes?n:0)}
function bomb(){shell('💣 Cyber Bomb Defusal','Use long, unique passphrases and multi-factor authentication (MFA).',`<p>A fictional account needs protection. Choose quickly.</p><div class="choices"><button class="choice" onclick="choice(this,false,'','Easy passwords are easy to guess.')">Use: school123</button><button class="choice" onclick="choice(this,true,'Defused! A unique passphrase plus MFA is strong.','')">Use a unique passphrase + MFA</button><button class="choice" onclick="choice(this,false,'','Never share a password.')">Share one password with everyone</button></div><p id="clock">Time: 15s</p>`);let s=15;timer=setInterval(()=>{s--;$('#clock').textContent='Time: '+s+'s';if(!s){clearInterval(timer);done('Practice timer ended. Restart and choose the strongest control.',0)}},1000)}
function hacker(){shell('🕵️ Find the Hacker','Unusual login patterns should be reported to IT or a trusted adult—never “hack back.”',`<p>Which fictional account needs investigation?</p><div class="terminal">08:12  maya — normal school Wi-Fi login<br>08:15  dev — normal school Wi-Fi login<br>08:17  alex — 47 failed passwords, then login from a new location<br>08:19  maya — homework portal</div><div class="choices"><button class="choice" onclick="choice(this,false,'','Normal-looking activity.')">maya</button><button class="choice" onclick="choice(this,false,'','Normal-looking activity.')">dev</button><button class="choice" onclick="choice(this,true,'Good catch: report and investigate safely.','')">alex</button></div>`)}
function server(){lives=3;shell('🖥️ Server Overload','Rate limits, monitoring, and escalation can protect availability during a traffic surge.',`<p>Fictional traffic is spiking. Pick a defensive response.</p><div class="meter"><i id="health"></i></div><p id="status">Server health: 100% • Lives: 3</p><div class="choices"><button class="choice" onclick="load(this,true)">Enable rate limits and alert the admin</button><button class="choice" onclick="load(this,false)">Delete random files</button><button class="choice" onclick="load(this,false)">Ignore the alerts</button></div>`)}function load(el,ok){if($('#game').dataset.done)return;if(ok){$('#game').dataset.done=1;el.classList.add('good');done('Stabilized! Calm, measured controls work.',25)}else{el.classList.add('bad');lives--;$('#health').style.width=lives*33+'%';$('#status').textContent=`Server health: ${lives*33}% • Lives: ${lives}`;if(!lives){$('#game').dataset.done=1;done('The practice server went offline. Restart and defend it.',0)}}}
function malware(){step=0;shell('🧫 Malware Containment','Isolate, report, use approved tools, and restore from a clean backup. Never spread suspicious files.',`<p>Choose the three safe steps in order.</p><div class="choices"><button class="choice" onclick="contain(0,this)">Disconnect the affected practice device</button><button class="choice" onclick="contain(1,this)">Report it to IT / a trusted adult</button><button class="choice" onclick="contain(2,this)">Use approved scanning and a clean backup</button><button class="choice" onclick="contain(9,this)">Upload the suspicious file online</button></div><p id="progress">0 of 3 safe steps</p>`)}function contain(n,el){if($('#game').dataset.done)return;if(n!==step){el.classList.add('bad');$('#progress').textContent=n===9?'Never distribute suspicious files.':'Order matters: isolate, report, then recover.';if(n===9){$('#game').dataset.done=1;done('Restart the safe simulation.',0)}return}el.classList.add('good');el.disabled=true;step++;$('#progress').textContent=step+' of 3 safe steps';if(step===3){$('#game').dataset.done=1;done('Contained safely. Great defensive choices!',30)}}
$('#cards').innerHTML=games.map(g=>`<article class="card"><div class="game-icon">${g[1]}</div><div class="tag">${g[3]}</div><h2>${g[2]}</h2><p>${g[4]}</p><button onclick="start('${g[0]}')">Start challenge →</button></article>`).join('');$('#total').textContent=score;
</script><script>
/* Keep completion controls together and clear a finished state before a new answer. */
new MutationObserver(()=>{const game=document.querySelector('#game'),controls=game&&game.querySelector('.controls');if(!game||!controls)return;const next=[...game.querySelectorAll('.lesson button')].find(b=>b.textContent.includes('Next level'));if(next&&!controls.contains(next)){controls.appendChild(next)}}).observe(document.querySelector('#game'),{childList:true,subtree:true});
</script></body></html>
