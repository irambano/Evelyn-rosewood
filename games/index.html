<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cybersecurity Games Hub</title><style>
:root{--bg:#071225;--panel:#102443;--line:#31527c;--a:#63f5d2;--p:#ff79ad;--muted:#b5c5db}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1d4774,transparent 38%),var(--bg);color:#edf6ff;font:16px system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:18px}.hero{text-align:center}.hero h1{color:var(--a);font-size:clamp(2rem,7vw,3.4rem);margin:.3em}.hero p,.note{color:var(--muted)}.bar,.game,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.bar{display:flex;justify-content:space-between;gap:12px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{box-shadow:0 12px 30px #0005}.tag{color:var(--a);font-size:.8rem;font-weight:bold}.card p{min-height:50px;color:var(--muted)}button{border:0;border-radius:10px;background:var(--a);color:#062a23;font:inherit;font-weight:750;padding:11px 14px;cursor:pointer}button.secondary{background:#29496f;color:#fff}.danger{background:var(--p);color:#3c0920}.hidden{display:none!important}.game{max-width:780px;margin:auto}.game h2{color:var(--a)}.lesson{border-left:4px solid #ffd166;background:#0a192d;padding:12px;border-radius:7px;margin:12px 0}.choices{display:grid;gap:9px;margin:15px 0}.choice{text-align:left;background:#244769;color:white}.good{background:#68dca3!important;color:#073522!important}.bad{background:#ff98bc!important;color:#430b24!important}.email{background:#f6f8fc;color:#15223a;padding:15px;border-radius:10px}.terminal{background:#020914;color:#98ffd0;font-family:monospace;padding:14px;border-radius:10px;line-height:1.7}.meter{height:18px;background:#061121;border-radius:10px;overflow:hidden}.meter i{display:block;height:100%;background:var(--a);width:100%;transition:.3s}.room{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.room button{min-height:100px;background:#29496f;color:#fff}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}@media(max-width:520px){.wrap{padding:12px}.bar{font-size:.8rem}.room{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><header class="hero"><h1>Cybersecurity Games Hub</h1><p>Six safe, fictional mini-games for learning cyber safety.</p></header><div class="bar"><span>🏆 Total points: <b id="total">0</b></span><span>Learn • Defend • Stay safe</span></div><section id="home"><div class="grid" id="cards"></div></section><section id="play" class="hidden"><article class="game" id="game"></article></section></main><script>
const $=s=>document.querySelector(s);const games=[['bomb','💣','Cyber Bomb Defusal','Password safety','Choose the best account protection before time runs out.'],['phish','🎣','Phishing Detective','Spot the scam','Inspect fictional messages for warning signs.'],['hacker','🕵️','Find the Hacker','Incident response','Use harmless logs to locate unusual activity.'],['server','🖥️','Server Overload','Availability','Protect a pretend school server during a traffic spike.'],['malware','🧫','Malware Containment','Device hygiene','Safely contain a fictional infection.'],['escape','🔐','Cyber Escape Room','Security basics','Solve three safety locks to escape the virtual lab.']];let score=+localStorage.cyberHubScore||0,timer,active,lives,step,opened=0;function points(n){score+=n;localStorage.cyberHubScore=score;$('#total').textContent=score}function home(){clearInterval(timer);$('#play').classList.add('hidden');$('#home').classList.remove('hidden')}function shell(t,l,b){$('#home').classList.add('hidden');$('#play').classList.remove('hidden');$('#game').innerHTML=`<button class="secondary" onclick="home()">← Games menu</button><h2>${t}</h2><div class="lesson">💡 <b>Learn:</b> ${l}</div>${b}<div class="controls"><button class="secondary" onclick="start(active)">↻ Restart</button><button class="secondary" onclick="home()">Home</button></div>`}function done(msg,n){clearInterval(timer);points(n);$('#game').insertAdjacentHTML('beforeend',`<div class="lesson"><b>${msg}</b>${n?' +'+n+' points.':''}</div>`)}function start(x){active=x;clearInterval(timer);({bomb,phish,hacker,server,malware,escape})[x]()}function choice(el,yes,good,bad,n=25){if($('#game').dataset.done)return;$('#game').dataset.done=1;el.classList.add(yes?'good':'bad');done(yes?good:bad,yes?n:0)}
function bomb(){shell('💣 Cyber Bomb Defusal','Use long, unique passphrases and multi-factor authentication (MFA).',`<p>A fictional account needs protection. Choose quickly.</p><div class="choices"><button class="choice" onclick="choice(this,false,'','Easy passwords are easy to guess.')">Use: school123</button><button class="choice" onclick="choice(this,true,'Defused! A unique passphrase plus MFA is strong.','')">Use a unique passphrase + MFA</button><button class="choice" onclick="choice(this,false,'','Never share a password.')">Share one password with everyone</button></div><p id="clock">Time: 15s</p>`);let s=15;timer=setInterval(()=>{s--;$('#clock').textContent='Time: '+s+'s';if(!s){clearInterval(timer);done('Practice timer ended. Restart and choose the strongest control.',0)}},1000)}
let mails=[['IT Help Desk &lt;support@school-reset.example&gt;','URGENT: Verify now at school-login-security.example.','phish'],['Library &lt;library@school.edu&gt;','Your reserved book is ready at the library desk.','safe'],['Prize Team &lt;win@free-gifts.example&gt;','You won a tablet. Pay a delivery fee to claim it.','phish']];function phish(){let i=0,correct=0;shell('🎣 Phishing Detective','Urgency, strange links, unexpected prizes, and requests for secrets are warning signs.',`<div id="mail"></div><div class="controls"><button onclick="judge('safe')">Looks safe</button><button class="danger" onclick="judge('phish')">Suspicious / phishing</button></div><p class="note" id="feedback"></p>`);function draw(){let m=mails[i];$('#mail').innerHTML=`<div class="email"><b>From: ${m[0]}</b><hr><p>${m[1]}</p></div><p>Message ${i+1} of 3</p>`}window.judge=x=>{let ok=x===mails[i][2];if(ok)correct++;$('#feedback').textContent=ok?'Correct!':'Not quite—check the warning signs.';i++;setTimeout(()=>i<3?draw():done(`Case closed: ${correct}/3 correct.`,correct*10),550)};draw()}
function hacker(){shell('🕵️ Find the Hacker','Unusual login patterns should be reported to IT or a trusted adult—never “hack back.”',`<p>Which fictional account needs investigation?</p><div class="terminal">08:12  maya — normal school Wi-Fi login<br>08:15  dev — normal school Wi-Fi login<br>08:17  alex — 47 failed passwords, then login from a new location<br>08:19  maya — homework portal</div><div class="choices"><button class="choice" onclick="choice(this,false,'','Normal-looking activity.')">maya</button><button class="choice" onclick="choice(this,false,'','Normal-looking activity.')">dev</button><button class="choice" onclick="choice(this,true,'Good catch: report and investigate safely.','')">alex</button></div>`)}
function server(){lives=3;shell('🖥️ Server Overload','Rate limits, monitoring, and escalation can protect availability during a traffic surge.',`<p>Fictional traffic is spiking. Pick a defensive response.</p><div class="meter"><i id="health"></i></div><p id="status">Server health: 100% • Lives: 3</p><div class="choices"><button class="choice" onclick="load(this,true)">Enable rate limits and alert the admin</button><button class="choice" onclick="load(this,false)">Delete random files</button><button class="choice" onclick="load(this,false)">Ignore the alerts</button></div>`)}function load(el,ok){if($('#game').dataset.done)return;if(ok){$('#game').dataset.done=1;el.classList.add('good');done('Stabilized! Calm, measured controls work.',25)}else{el.classList.add('bad');lives--;$('#health').style.width=lives*33+'%';$('#status').textContent=`Server health: ${lives*33}% • Lives: ${lives}`;if(!lives){$('#game').dataset.done=1;done('The practice server went offline. Restart and defend it.',0)}}}
function malware(){step=0;shell('🧫 Malware Containment','Isolate, report, use approved tools, and restore from a clean backup. Never spread suspicious files.',`<p>Choose the three safe steps in order.</p><div class="choices"><button class="choice" onclick="contain(0,this)">Disconnect the affected practice device</button><button class="choice" onclick="contain(1,this)">Report it to IT / a trusted adult</button><button class="choice" onclick="contain(2,this)">Use approved scanning and a clean backup</button><button class="choice" onclick="contain(9,this)">Upload the suspicious file online</button></div><p id="progress">0 of 3 safe steps</p>`)}function contain(n,el){if($('#game').dataset.done)return;if(n!==step){el.classList.add('bad');$('#progress').textContent=n===9?'Never distribute suspicious files.':'Order matters: isolate, report, then recover.';if(n===9){$('#game').dataset.done=1;done('Restart the safe simulation.',0)}return}el.classList.add('good');el.disabled=true;step++;$('#progress').textContent=step+' of 3 safe steps';if(step===3){$('#game').dataset.done=1;done('Contained safely. Great defensive choices!',30)}}
function escape(){opened=0;shell('🔐 Cyber Escape Room','Strong credentials, checking real link destinations, and updates create layers of protection.',`<p>Open all three locks to escape.</p><div class="room"><button onclick="lock(this,'Password lock','Which is strongest?','BlueHorse!94','password','myname2020')">🔒 Password lock</button><button onclick="lock(this,'Link lock','What should you check?','The real destination/domain','Emoji count','Friend clicks')">🔒 Link lock</button><button onclick="lock(this,'Update lock','Why update?','Fix security weaknesses','Make a device heavier','Delete photos')">🔒 Update lock</button></div><div id="puzzle" class="lesson">Choose a lock.</div>`)}function lock(btn,name,q,a,b,c){window.lockBtn=btn;$('#puzzle').innerHTML=`<b>${name}: ${q}</b><div class="choices"><button class="choice" onclick="solve(true)">${a}</button><button class="choice" onclick="solve(false)">${b}</button><button class="choice" onclick="solve(false)">${c}</button></div>`}function solve(ok){if(ok){$('#puzzle').textContent='✅ Lock opened!';lockBtn.classList.add('good');lockBtn.disabled=true;if(++opened===3)done('Escape complete! Three smart habits unlocked the lab.',40)}else $('#puzzle').textContent='❌ Not quite. Select the lock again and think safety-first.'}
$('#cards').innerHTML=games.map(g=>`<article class="card"><div class="tag">${g[1]} ${g[3]}</div><h2>${g[2]}</h2><p>${g[4]}</p><button onclick="start('${g[0]}')">Play game</button></article>`).join('');$('#total').textContent=score;
</script></body></html>
