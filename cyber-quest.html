<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cyber Quest - Beginner Edition</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:radial-gradient(circle at top,#172b46 0,#080d16 45%,#05070b 100%);color:#fff;text-align:center;margin:0;padding:28px 40px;min-height:100vh}
h1{color:#63f5ff;text-shadow:0 0 12px #0ff,0 0 30px #087fda;font-size:clamp(38px,6vw,68px);margin:8px 0 12px;letter-spacing:3px}
h2{color:#8eeaff;text-shadow:0 0 10px #087fda}
button{margin:8px;padding:14px 24px;font-size:17px;cursor:pointer;border:1px solid #27dfff;border-radius:12px;background:linear-gradient(135deg,#087fda,#1742a0);color:#fff;box-shadow:0 5px 18px rgba(0,180,255,.22);transition:.15s;min-width:150px}
button:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.2);box-shadow:0 8px 25px rgba(0,220,255,.35)}
button:active{transform:translateY(1px)}
input{padding:13px 15px;border-radius:10px;border:1px solid #35dfff;background:#101a28;color:#fff;font-size:17px;outline:none}
#menu{max-width:1100px;margin:0 auto 24px;padding:18px;border:1px solid #244b70;border-radius:20px;background:rgba(13,25,42,.78);box-shadow:0 15px 45px rgba(0,0,0,.35)}
#menu p{margin:4px 0 12px;color:#b9d8ef;font-size:18px}
#gameArea{margin:25px auto;max-width:1100px;min-height:240px;padding:38px;border:1px solid #285578;border-radius:22px;background:linear-gradient(145deg,rgba(18,35,55,.96),rgba(8,15,26,.96));box-shadow:0 18px 55px rgba(0,0,0,.4)}
#gameArea p{font-size:19px;line-height:1.5}
#scoreBoard{margin:18px auto;font-size:21px;color:#69ff9a;font-weight:bold;max-width:1100px;padding:12px;border-radius:12px;background:rgba(0,40,25,.35)}
.card{display:inline-block;width:88px;height:88px;margin:10px;font-size:30px}
.hidden{display:none}.back{background:#334155;border-color:#64748b}.level{color:#ffd84d;font-weight:bold;font-size:19px;letter-spacing:2px}
.mini-title{font-size:28px;color:#ffdf70}
@media(max-width:700px){body{padding:18px 12px}#gameArea{padding:22px 14px}button{min-width:135px;padding:12px 16px;font-size:15px}h1{letter-spacing:1px}}
</style>
</head>
<body>
<h1>🛡️ CYBER QUEST</h1>
<div id="menu"><p>Select a game to play:</p>
<button onclick="startPhishing()">🎣 Phishing Detective</button><button onclick="startIncident()">🚨 Incident Response</button>
<button onclick="startQuiz()">🛡️ Network Defender Quiz</button><button onclick="startEscape()">🔐 Cyber Escape Room</button>
<button onclick="showLeaderboard()">🏆 Leaderboard</button></div>
<div id="gameArea"><p>Choose a game to begin!</p></div><div id="scoreBoard">Total Score: 0</div>
<script>
let totalScore=0,gamesPlayed=[],level=1;
const area=()=>document.getElementById("gameArea");
function enterGame(){document.getElementById("menu").classList.add("hidden")}
function exitGame(){document.getElementById("menu").classList.remove("hidden");level=1;area().innerHTML="<p>Choose a game to begin!</p>"}
function backButton(){return '<br><button class="back" onclick="exitGame()">← Back to Games</button>'}
function updateScore(p){totalScore+=p;document.getElementById("scoreBoard").textContent="Total Score: "+totalScore}
function markGamePlayed(n){if(!gamesPlayed.includes(n))gamesPlayed.push(n)}
function feedback(ok){area().insertAdjacentHTML("beforeend",`<p style="color:${ok?'#0f0':'#f66'}">${ok?'✅ Correct! +10 points':'❌ Wrong! -5 points'}</p>`);updateScore(ok?10:-5)}
function nextLevelButton(fn){return '<button onclick="'+fn+'()">🚀 Next Level</button>'+backButton()}
function miniDone(nextFn,finalText,msg){updateScore(5);area().innerHTML='<h2>🎉 Mission Complete!</h2><p>'+msg+'</p><p style="color:#69ff9a">+5 BONUS POINTS</p>'+(nextFn?nextLevelButton(nextFn):'<p>'+finalText+'</p>'+backButton())}
function showMiniGame(nextFn,finalText,type){
 if(type==="reaction"){area().innerHTML='<div class="mini-title">⚡ LASER REACTION RUN</div><p>🚨 Security breach! Wait for the alarm to turn green, then HIT GO!</p><button id="miniBtn" disabled>🔴 ARMED...</button>';setTimeout(()=>{const b=document.getElementById("miniBtn");if(!b)return;b.disabled=false;b.textContent="🟢 HIT GO!";b.onclick=()=>miniDone(nextFn,finalText,"⚡ You dodged the firewall laser!");},900+Math.random()*1400);return}
 if(type==="memory"){let vals=["🔐","🔐","🛡️","🛡️","🧬","🧬"].sort(()=>Math.random()-.5),first=null,lock=false,matches=0;area().innerHTML='<div class="mini-title">🕵️ SECURITY VAULT</div><p>Match the 3 security pairs before the vault locks!</p><div id="cards"></div>';vals.forEach(v=>{let b=document.createElement("button");b.className="card";b.textContent="❓";b.dataset.v=v;b.onclick=()=>{if(lock||b.textContent!=="❓")return;b.textContent=v;if(!first){first=b;return}lock=true;if(first.dataset.v===v){matches+=2;first=null;lock=false;if(matches===6)miniDone(nextFn,finalText,"🔓 Vault unlocked! You secured the network.");}else setTimeout(()=>{first.textContent="❓";b.textContent="❓";first=null;lock=false},450)};document.getElementById("cards").appendChild(b)});return}
 let a=Math.floor(Math.random()*8)+3,b=Math.floor(Math.random()*8)+3,ans=a+b;area().innerHTML='<div class="mini-title">🚀 CYBER ROCKET ESCAPE</div><p>🚨 The server is exploding! Solve the code to launch the escape rocket.</p><h2>'+a+' + '+b+' = ?</h2><input id="miniAns" type="number" autofocus><button onclick="finishMiniMath('+ans+')">🚀 LAUNCH!</button>';window.finishMiniMath=(x)=>{const el=document.getElementById("miniAns");if(el&&Number(el.value)===x)miniDone(nextFn,finalText,"🚀 Rocket launched! You escaped the collapsing server.");else area().insertAdjacentHTML("beforeend",'<p style="color:#ff6b6b">💥 Wrong code! Try again before the countdown ends!</p>')}}
function levelComplete(nextFn,finalText,type){showMiniGame(nextFn,finalText,type)}
let phishingQ=0;
const phishingLevels=[
[{q:'Email: "Win a free iPhone! Click here."',a:'Phishing'},{q:'Your teacher shared homework on the school portal.',a:'Legitimate'}],
[{q:'A message says your account will be deleted in 10 minutes unless you click a link.',a:'Phishing'},{q:'You expected an email from your bank and open its official app to check the alert instead of clicking the email link.',a:'Legitimate'}],
[{q:'The sender address is support@paypa1-security.example and asks you to enter your password on a link.',a:'Phishing'},{q:'An email passes normal checks but asks for your password and one-time code. What should you do?',a:'Phishing'}]];
function startPhishing(){enterGame();level=1;markGamePlayed("Phishing Detective");phishingQ=0;nextPhishing()}
function nextPhishing(){let qs=phishingLevels[level-1];if(phishingQ<qs.length){let q=qs[phishingQ];area().innerHTML=`<div class="level">LEVEL ${level}</div><h2>🎣 Phishing Detective</h2><p>${q.q}</p><button onclick="checkPhishing('Phishing')">Phishing</button><button onclick="checkPhishing('Legitimate')">Legitimate</button>`}else levelComplete(level<3?'advancePhishing':null,'🏆 Phishing Detective completed!','reaction');}
function checkPhishing(a){feedback(a===phishingLevels[level-1][phishingQ].a);phishingQ++;setTimeout(nextPhishing,500)}
function advancePhishing(){level++;phishingQ=0;nextPhishing()}

let incidentQ=0;
const incidentLevels=[
[{q:"Ransomware appears on a computer. What should you do first?",o:["Isolate Computer","Pay Money"],a:"Isolate Computer"},{q:"You see a strange login at midnight. What should you do?",o:["Tell Admin","Ignore"],a:"Tell Admin"}],
[{q:"Malware is spreading between computers. What is the safest immediate action?",o:["Disconnect Affected Systems","Share Files"],a:"Disconnect Affected Systems"},{q:"A user reports a suspicious attachment before opening it. What should they do?",o:["Report It","Open It"],a:"Report It"}],
[{q:"Several accounts are compromised at once. What should an incident responder prioritize?",o:["Contain the Incident","Post Passwords Online"],a:"Contain the Incident"},{q:"A security log shows repeated failed logins followed by a successful login from an unusual location. What should happen next?",o:["Investigate and Alert","Ignore It"],a:"Investigate and Alert"}]];
function startIncident(){enterGame();level=1;markGamePlayed("Incident Response");incidentQ=0;nextIncident()}
function nextIncident(){let qs=incidentLevels[level-1];if(incidentQ<qs.length){let s=qs[incidentQ];area().innerHTML=`<div class="level">LEVEL ${level}</div><h2>🚨 Incident Response</h2><p>${s.q}</p>`+s.o.map(o=>`<button onclick="checkIncident('${o}')">${o}</button>`).join("")}else levelComplete(level<3?'advanceIncident':null,'🏆 Incident Response completed!','memory');}
function checkIncident(a){feedback(a===incidentLevels[level-1][incidentQ].a);incidentQ++;setTimeout(nextIncident,500)}
function advanceIncident(){level++;incidentQ=0;nextIncident()}

let quizQ=0;
const quizLevels=[
[{q:"Which tool helps block unauthorized network access?",o:["Firewall","Calculator"],a:"Firewall"},{q:"HTTPS means your connection is…",o:["Secure","Fast"],a:"Secure"}],
[{q:"Which control limits how many requests a server accepts in a short time?",o:["Rate Limiting","Screen Brightness"],a:"Rate Limiting"},{q:"Which security method adds a second verification step after a password?",o:["Multi-factor Authentication","Auto-play"],a:"Multi-factor Authentication"}],
[{q:"Which attack attempts to overwhelm a service with traffic from many systems?",o:["Distributed Denial-of-Service (DDoS)","Data Backup"],a:"Distributed Denial-of-Service (DDoS)"},{q:"A firewall rule should generally allow network traffic only when it is…",o:["Needed and authorized","Randomly selected"],a:"Needed and authorized"}]];
function startQuiz(){enterGame();level=1;markGamePlayed("Network Defender Quiz");quizQ=0;nextQuiz()}
function nextQuiz(){let qs=quizLevels[level-1];if(quizQ<qs.length){let q=qs[quizQ];area().innerHTML=`<div class="level">LEVEL ${level}</div><h2>🛡️ Network Defender Quiz</h2><p>${q.q}</p>`+q.o.map(o=>`<button onclick="checkQuiz('${o}')">${o}</button>`).join("")}else levelComplete(level<3?'advanceQuiz':null,'🏆 Network Defender completed!','reaction');}
function checkQuiz(a){feedback(a===quizLevels[level-1][quizQ].a);quizQ++;setTimeout(nextQuiz,500)}
function advanceQuiz(){level++;quizQ=0;nextQuiz()}

let escapeQ=0;
const escapeLevels=[
[{q:"Puzzle: 2 + 2 = ?",type:"input",a:"4"},{q:"Which is a common cyber-safety step?",o:["Update Software","Ignore Updates"],a:"Update Software"}],
[{q:"Puzzle: 12 ÷ 3 = ?",type:"input",a:"4"},{q:"Which action helps protect an account after a suspected password theft?",o:["Change the Password","Reuse the Same Password"],a:"Change the Password"}],
[{q:"Puzzle: If a code starts at 5 and adds 7, what is the result?",type:"input",a:"12"},{q:"Which practice best reduces the damage if ransomware encrypts your files?",o:["Keep Tested Backups","Use One Password Everywhere"],a:"Keep Tested Backups"}]];
function startEscape(){enterGame();level=1;markGamePlayed("Cyber Escape Room");escapeQ=0;nextEscape()}
function nextEscape(){let qs=escapeLevels[level-1];if(escapeQ<qs.length){let p=qs[escapeQ];if(p.type==="input")area().innerHTML=`<div class="level">LEVEL ${level}</div><h2>🔐 Cyber Escape Room</h2><p>${p.q}</p><input id="ans"><button onclick="checkEscapeInput()">Submit</button>`;else area().innerHTML=`<div class="level">LEVEL ${level}</div><h2>🔐 Cyber Escape Room</h2><p>${p.q}</p>`+p.o.map(o=>`<button onclick="checkEscapeChoice('${o}')">${o}</button>`).join("")}else levelComplete(level<3?'advanceEscape':null,'🏆 Cyber Escape Room completed!','math');}
function checkEscapeInput(){feedback(document.getElementById("ans").value.trim()===escapeLevels[level-1][escapeQ].a);escapeQ++;setTimeout(nextEscape,500)}
function checkEscapeChoice(a){feedback(a===escapeLevels[level-1][escapeQ].a);escapeQ++;setTimeout(nextEscape,500)}
function advanceEscape(){level++;escapeQ=0;nextEscape()}

function showLeaderboard(){enterGame();let rank=totalScore>=80?"Cybersecurity Expert":totalScore>=40?"Cyber Defender":"Beginner";area().innerHTML=`<h2>🏆 Leaderboard</h2><p>Score: <strong>${totalScore}</strong></p><p>Games Played: ${gamesPlayed.length}</p><p>Rank: <strong>${rank}</strong></p><button onclick="resetGame()">Reset Score</button>`+backButton()}
function resetGame(){totalScore=0;gamesPlayed=[];level=1;document.getElementById("scoreBoard").textContent="Total Score: 0";area().innerHTML="<h2>🔄 Score Reset!</h2>"+backButton()}
</script>
</body>
</html>
